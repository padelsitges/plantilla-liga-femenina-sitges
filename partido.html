<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lliga Femenina Pàdel Sitges — Partit Confirmat</title>
<style>
:root{--green:#a8ef24;--dark:#121814;--card:#1f2821;--muted:#cdd6c9}
*{box-sizing:border-box}
body{margin:0;background:#eef2ec;font-family:Arial,sans-serif;color:var(--dark)}
.wrap{max-width:460px;margin:0 auto;padding:18px}
h1{font-size:22px;text-align:center;margin:4px 0 18px}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 5px 22px #0001}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd4c9;border-radius:10px;font-size:16px}
input::placeholder{color:#8a9388}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:var(--green);color:var(--dark);font-size:17px;font-weight:800;cursor:pointer}
#preview{margin-top:22px;display:none}
canvas{width:100%;border-radius:16px;display:block;background:var(--dark)}
.small{text-align:center;color:#667064;font-size:12px;margin-top:9px}
.error{text-align:center;color:#b3261e;font-size:13px;font-weight:700;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🎾💚 PLANTILLA DE PARTIT CONFIRMAT 💚🎾</h1>
<div class="panel">
<label>📅 Dia</label>
<input id="day" placeholder="Escriu el dia">
<label>⏰ Hora</label>
<input id="time" placeholder="Escriu l'hora">
<label>📍 Lloc</label>
<input id="place" placeholder="Escriu el lloc">
<label>🟢 Parella 1</label>
<input id="p1" placeholder="Nom de les jugadores">
<label>⚪ Parella 2</label>
<input id="p2" placeholder="Nom de les jugadores">
<button onclick="makeCard()">CREAR TARGETA 🎾</button>
<div id="error" class="error">Si us plau, omple tots els camps abans de crear la targeta.</div>
<div id="preview">
<canvas id="card" width="1080" height="1080"></canvas>
<button onclick="downloadCard()">📥 DESAR IMATGE</button>
<div class="small">Després pots pujar la imatge directament al grup de WhatsApp.</div>
</div>
</div>
</div>
<script>
function makeCard(){
 const ids=['day','time','place','p1','p2'];
 const values=ids.map(id=>document.getElementById(id).value.trim());
 const error=document.getElementById('error');
 if(values.some(v=>!v)){error.style.display='block';return;}
 error.style.display='none';
 const c=document.getElementById('card'),x=c.getContext('2d');
 x.fillStyle='#121814';x.fillRect(0,0,1080,1080);
 x.fillStyle='#a8ef24';x.fillRect(0,0,1080,16);
 x.textAlign='center';
 x.fillStyle='#fff';x.font='bold 31px Arial';
 x.fillText('🎾💚  LLIGA FEMENINA PÀDEL SITGES  💚🎾',540,78);
 x.fillStyle='#a8ef24';x.font='bold 58px Arial';
 x.fillText('PARTIT CONFIRMAT',540,165);
 const vals=[['📅','DIA',values[0]],['⏰','HORA',values[1]],['📍','LLOC',values[2]]];
 vals.forEach((v,i)=>{
  let xx=75+i*325;
  x.fillStyle='#1f2821';roundRect(x,xx,235,290,135,18);x.fill();
  x.fillStyle='#cdd6c9';x.font='bold 18px Arial';
  x.fillText(v[0]+'  '+v[1],xx+145,275);
  x.fillStyle='#fff';x.font='bold 27px Arial';
  x.fillText(v[2].toUpperCase(),xx+145,335);
 });
 x.fillStyle='#cdd6c9';x.font='bold 18px Arial';
 x.fillText('LES PARELLES',540,420);
 x.fillStyle='#fff';x.font='bold 48px Arial';
 x.fillText(values[3].toUpperCase(),540,505);
 x.fillStyle='#a8ef24';x.font='bold 42px Arial';
 x.fillText('🆚',540,570);
 x.fillStyle='#fff';x.font='bold 48px Arial';
 x.fillText(values[4].toUpperCase(),540,645);
 x.fillStyle='#a8ef24';x.fillRect(165,725,750,3);
 x.font='bold 29px Arial';
 x.fillText('🎾  ENS VEIEM A PISTA!  💚',540,790);
 document.getElementById('preview').style.display='block';
}
function roundRect(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function downloadCard(){
 const a=document.createElement('a');
 a.download='Partit_Confirmat.png';
 a.href=document.getElementById('card').toDataURL('image/png');a.click();
}
</script>
</body>
</html>
